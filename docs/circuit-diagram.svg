<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="640" viewBox="0 0 1050 640"><title>Pi Zero 2 W entryway BME280 and NC door contact</title><rect width="1050" height="640" fill="white"/><g font-family="sans-serif" font-size="18" fill="#123"><text x="25" y="35">ID11 • Raspberry Pi Zero 2 W • GPIO logic 3.3V only</text><rect x="40" y="100" width="350" height="370" fill="#e9f4fa" stroke="#123"/><text x="60" y="140">40-pin header, physical numbering</text><text x="60" y="200">Pin1 3V3</text><text x="60" y="255">Pin3 BCM2 SDA / I2C1</text><text x="60" y="310">Pin5 BCM3 SCL / I2C1</text><text x="60" y="365">Pin16 BCM23 input, pull-up</text><text x="60" y="420">Pin6 GND</text><rect x="650" y="110" width="350" height="180" fill="#eef8ee" stroke="#123"/><text x="670" y="145">BME280 address 0x76</text><text x="670" y="185">VCC/CSB →3V3; SDO →GND</text><text x="670" y="225">SDA →pin3; SCL →pin5</text><text x="670" y="265">GND →pin6</text><rect x="650" y="340" width="350" height="100" fill="#eef8ee" stroke="#123"/><text x="670" y="370">Normally-closed reed contact</text><text x="670" y="405">BCM23 ↔contact ↔GND</text><text x="25" y="520">Pi micro-USB PWR IN: regulated 5V. No 5V connection to GPIO or sensor rail.</text><text x="25" y="560">BLE: built-in adapter → custom 7-byte read/notify characteristic (no wires).</text><text x="25" y="600">HTTP dashboard: loopback by default; explicitly bind LAN only in isolated lab.</text></g><g fill="none" stroke="#287396" stroke-width="3"><path d="M390 195 H540 V180 H650"/><path d="M390 250 H650"/><path d="M390 305 H600 V230 H650"/><path d="M390 360 H650"/><path d="M390 415 H560 V460 H1000"/></g></svg>